  <rect width="1200" height="760" fill="#efe9e1"/>
  <circle cx="604" cy="394" r="238" fill="none" stroke="#e2d9cb" stroke-width="1.5"/>
  <circle cx="604" cy="394" r="292" fill="none" stroke="#e4dbcf" stroke-width="1.5" stroke-dasharray="4 10"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
