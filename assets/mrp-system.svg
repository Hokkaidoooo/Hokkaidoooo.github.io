    <g fill="#fbf9f4" stroke="#d8cbbb" stroke-width="2"><rect x="205" y="374" width="264" height="88" rx="16"/><rect x="731" y="374" width="264" height="88" rx="16"/></g>
    <g fill="#6c614f" font-size="28" text-anchor="middle"><text x="337" y="429">组件 A</text><text x="863" y="429">组件 B</text></g>
    <g fill="#e4d8c7" stroke="#d1bfa7" stroke-width="1.5"><rect x="110" y="562" width="206" height="77" rx="15"/><rect x="497" y="562" width="206" height="77" rx="15"/><rect x="884" y="562" width="206" height="77" rx="15"/></g>
