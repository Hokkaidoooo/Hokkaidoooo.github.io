    <text x="1129" y="70" text-anchor="end" font-size="20" fill="#8b7761">结构示意</text>
    <g fill="none" stroke="#bca992" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M600 267v62H337v44M600 329h263v44"/><path d="M337 456v62H213v44M337 518h263v44M863 456v62H600M863 518h124v44"/></g>
    <rect x="465" y="149" width="270" height="122" rx="21" fill="#6a785c"/>
